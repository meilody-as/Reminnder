<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Reminder Pribadi (JSONBin Sync)</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<style>
/* ===== BASE ===== */
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:#f4f6f8;
  margin:0;
  padding:16px;
  padding-bottom: 80px;
  color: #1e293b;
}
h2,h3{margin:8px 0; color: #0f172a;}
input,select,button{
  width:100%;
  padding:12px;
  margin:8px 0 4px 0;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-size:16px;
  box-sizing: border-box;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:600;
  cursor: pointer;
}
button:active{opacity: 0.8;}
button.success{background:#16a34a;color:white;}
button.secondary{background:#475569;}
button.danger{background:#dc2626;}
button.edit{background:#f59e0b; color: white; margin-top: 5px;}
button.action-btn{margin-top: 5px;}

.hidden{display:none !important;}

/* ===== CARD ===== */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 6px -1px rgba(0,0,0,.1);
}

/* ===== UTILS ===== */
.flex{
  display:flex;
  gap:10px;
}
.flex input, .flex select{
  margin-top:0;
}

/* ===== STATUS SYNC ===== */
.sync{
  padding:10px;
  border-radius:8px;
  font-size:14px;
  margin-bottom:12px;
  text-align:center;
  font-weight:600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.sync.synced{background:#dcfce7;color:#166534; border: 1px solid #86efac;}
.sync.loading{background:#fffbeb;color:#b45309; border: 1px solid #fcd34d;}
.sync.error{background:#fee2e2;color:#991b1b; border: 1px solid #fca5a5;}

/* ===== SPINNER ===== */
.spinner{
  border:3px solid #e5e7eb;
  border-top:3px solid #2563eb;
  border-radius:50%;
  width:20px;
  height:20px;
  animation:spin 1s linear infinite;
  display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#1f2937;
  color:#fff;
  padding:12px 24px;
  border-radius:50px;
  font-size:14px;
  z-index:1000;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  opacity:0;
  transition: opacity 0.3s;
  pointer-events: none;
  width: max-content;
  max-width: 90%;
}
#toast.show{opacity:1;}

/* ===== LIST ITEM ===== */
.list-item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  position:relative;
}
.list-item small{
  color:#64748b;
  display:block;
  margin-bottom:4px;
}

/* ===== BADGE ===== */
.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  color:#fff;
  background:#94a3b8; 
  margin-bottom:8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.bg-sim{background:#16a34a}
.bg-stnk{background:#0284c7}
.bg-oli{background:#9333ea}
.bg-pajak{background:#dc2626}
.bg-asuransi{background:#0f766e}
.bg-service{background:#7c3aed}
.bg-lainnya{background:#64748b}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}
.actions button {
  flex: 1;
  padding: 8px;
  font-size: 13px;
}

#fileInput { display: none; }
</style>
</head>

<body>

<h2>🔔 Reminder Cloud</h2>

<!-- Status Sinkronisasi -->
<div id="syncStatus" class="sync loading">
  <div class="spinner"></div> <span>Menghubungkan ke JSONBin...</span>
</div>

<!-- Form Input -->
<div class="card">
  <h3 id="formTitle">➕ Tambah Reminder</h3>

  <label>👤 Pemilik</label>
  <input id="pemilik" placeholder="Contoh: Saya / Istri">

  <label>🏷️ Kategori</label>
  <select id="kategori">
    <option value="SIM C">SIM C</option>
    <option value="SIM A">SIM A</option>
    <option value="SIM C Isteri">SIM C Isteri</option>
    <option value="Pajak Motor">Pajak Motor</option>
    <option value="Pajak Mobil">Pajak Mobil</option>
    <option value="Oli Motor">Oli Motor</option>
    <option value="Service Mobil">Service Mobil</option>
    <option value="Lainnya">Lainnya</option>
  </select>

  <label>📄 Nama / Keterangan</label>
  <input id="nama" placeholder="Contoh: Plat B 1234 XYZ">

  <label>📅 Tanggal Mulai</label>
  <input id="start_date" type="date">

  <label>⏱️ Periode Berulang</label>
  <div class="flex">
    <input id="periode_value" type="number" placeholder="Jumlah" min="1">
    <select id="periode_unit">
      <option value="bulan">Bulan</option>
      <option value="tahun">Tahun</option>
    </select>
  </div>

  <label>🔔 Pengingat (Hari sebelum)</label>
  <input id="custom_days" placeholder="Contoh: 30, 7, 1">

  <button id="btnSave" onclick="processSave()">➕ Simpan ke Cloud</button>
  <button id="btnCancel" class="secondary hidden" onclick="resetForm()">Batal Edit</button>
</div>

<div class="card">
  <h3>📋 Daftar Aktif</h3>
  <div id="list"></div>
  <small id="emptyMsg" class="hidden" style="display:block; text-align:center; color:#94a3b8; margin:20px 0;">Memuat data...</small>
</div>

<!-- Backup & Restore -->
<div class="card">
  <h3>💾 Data Lokal</h3>
  <p style="font-size:13px; color:#64748b;">Gunakan ini jika ingin backup ke file JSON.</p>
  <button class="secondary action-btn" onclick="downloadJson()">⬇️ Download Backup</button>
  <button class="success action-btn" onclick="triggerUpload()">⬆️ Restore JSON</button>
  <input type="file" id="fileInput" accept=".json" onchange="handleFileUpload(this)">
</div>

<div id="toast">Notifikasi</div>
  
<script>
  // --- KONFIGURASI JSONBIN ---
  const BIN_ID = "6960389443b1c97be922ca7d"; 
  const MASTER_KEY = "$2a$10$tnj0y.KyjfojXatJ76wG6O16DUQ8/6f4qYEqa1hKQ42z/8ljlfNhC"; 
  // ---------------------------------

  const els = {
    nama: document.getElementById('nama'),
    pemilik: document.getElementById('pemilik'),
    kategori: document.getElementById('kategori'),
    start_date: document.getElementById('start_date'),
    periode_value: document.getElementById('periode_value'),
    periode_unit: document.getElementById('periode_unit'),
    custom_days: document.getElementById('custom_days'),
    list: document.getElementById('list'),
    btnSave: document.getElementById('btnSave'),
    btnCancel: document.getElementById('btnCancel'),
    formTitle: document.getElementById('formTitle'),
    emptyMsg: document.getElementById('emptyMsg'),
    syncStatus: document.getElementById('syncStatus')
  };

  let reminders = [];
  let editIndex = null;

  // --- FUNGSI KONEKSI DATABASE ---

  async function fetchData() {
    if(BIN_ID === "ISI_DENGAN_BIN_ID_ANDA") {
      updateStatus(false, "🔴 Bin ID belum diisi di kode!");
      return;
    }

    try {
      updateStatus(null, "🟡 Mengambil data...");
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: {
          'X-Master-Key': MASTER_KEY
        }
      });
      
      if (!response.ok) throw new Error("Gagal mengambil data");
      
      const data = await response.json();
      reminders = data.record || []; 
      
      // Pembersihan Data Agresif
      reminders = reminders.filter(r => r && typeof r === 'object');

      // Perbaikan Data Kategori
      reminders = reminders.map(r => {
        if (typeof r.kategori !== 'string') r.kategori = 'Lainnya'; 
        if (!r.nama) r.nama = "Tanpa Nama"; 
        return r;
      });
      
      updateStatus(true, "🟢 Data Tersinkronisasi");
      renderList();
    } catch (error) {
      console.error(error);
      updateStatus(false, "🔴 Error: " + error.message);
      reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
      renderList();
    }
  }

  async function saveData() {
    try {
      updateStatus(null, "🟡 Menyimpan...");
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify({
          "record": reminders
        })
      });

      if (!response.ok) throw new Error("Gagal menyimpan");
      
      updateStatus(true, "🟢 Berhasil Disimpan");
    } catch (error) {
      console.error(error);
      updateStatus(false, "🔴 Gagal Simpan");
      showToast("❌ Gagal simpan ke cloud");
    }
  }

  // --- FUNGSI UTAMA ---

  function processSave() {
    if (!els.nama.value || !els.start_date.value) {
      showToast("⚠️ Nama dan Tanggal wajib diisi!");
      return;
    }

    const calculatedDue = calculateDueDate(
      els.start_date.value,
      els.periode_value.value,
      els.periode_unit.value
    );

    const remindersArr = els.custom_days.value
      .split(',')
      .map(d => Number(d.trim()))
      .filter(n => !isNaN(n));

    const data = {
      pemilik: els.pemilik.value,
      kategori: els.kategori.value,
      nama: els.nama.value,
      start_date: els.start_date.value,
      due: calculatedDue || els.start_date.value,
      periode: {
        value: Number(els.periode_value.value) || 0,
        unit: els.periode_unit.value
      },
      custom_reminder: remindersArr,
      status: 'pending',
      completed_at: null,
      created_at: new Date().toISOString()
    };

    if (editIndex !== null) {
      data.created_at = reminders[editIndex].created_at;
      reminders[editIndex] = data;
      showToast("✅ Diupdate");
    } else {
      reminders.push(data);
      showToast("✅ Ditambahkan");
    }

    saveData(); // Simpan ke server
    resetForm();
    renderList(); // PERBAIKAN: Refresh tampilan langsung!
  }

  function markDone(i) {
    const r = reminders[i];
    if (r.periode && r.periode.value > 0) {
      const nextDue = calculateDueDate(r.due, r.periode.value, r.periode.unit);
      reminders[i].due = nextDue;
      reminders[i].start_date = nextDue;
      showToast(`🔄 Diperbarui ke: ${nextDue}`);
    } else {
      reminders.splice(i, 1); 
      showToast("✅ Selesai & Dihapus");
    }
    saveData();
    renderList(); // PERBAIKAN: Refresh tampilan
  }

  function deleteReminder(i) {
    if (confirm('Hapus reminder ini?')) {
      reminders.splice(i, 1);
      saveData();
      showToast("🗑️ Dihapus");
      renderList(); // PERBAIKAN: Refresh tampilan
    }
  }

  function editReminder(i) {
    const r = reminders[i];
    editIndex = i;
    
    // Scroll ke form agar nyaman
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });

    els.pemilik.value = r.pemilik || '';
    els.kategori.value = r.kategori || 'Lainnya';
    els.nama.value = r.nama || '';
    els.start_date.value = r.start_date || '';
    els.periode_value.value = r.periode?.value || '';
    els.periode_unit.value = r.periode?.unit || 'bulan';
    els.custom_days.value = (r.custom_reminder || []).join(',');

    els.formTitle.textContent = "✏️ Edit Reminder";
    els.btnSave.textContent = "💾 Simpan Perubahan";
    els.btnCancel.classList.remove('hidden');
  }

  function resetForm() {
    els.pemilik.value = '';
    els.kategori.selectedIndex = 0;
    els.nama.value = '';
    els.start_date.value = '';
    els.periode_value.value = '';
    els.periode_unit.value = 'bulan';
    els.custom_days.value = '';
    editIndex = null;
    els.formTitle.textContent = "➕ Tambah Reminder";
    els.btnSave.textContent = "➕ Simpan ke Cloud";
    els.btnCancel.classList.add('hidden');
  }

  // --- HELPER FUNCTIONS ---

  function calculateDueDate(startDate, periodVal, periodUnit) {
    if (!startDate) return '';
    const d = new Date(startDate);
    const val = Number(periodVal) || 0;
    if (periodUnit === 'bulan') d.setMonth(d.getMonth() + val);
    else if (periodUnit === 'tahun') d.setFullYear(d.getFullYear() + val);
    return d.toISOString().slice(0, 10);
  }

  function getCategoryClass(kat) {
    if (typeof kat !== 'string') return 'bg-lainnya';
    if (kat === '') return 'bg-lainnya';

    if (kat.includes('SIM')) return 'bg-sim';
    if (kat.includes('STNK')) return 'bg-stnk';
    if (kat.includes('Pajak')) return 'bg-pajak';
    if (kat.includes('Oli')) return 'bg-oli';
    if (kat.includes('Service')) return 'bg-service';
    if (kat.includes('Asuransi')) return 'bg-asuransi';
    return 'bg-lainnya';
  }

  function updateStatus(isSuccess, msg) {
    els.syncStatus.innerHTML = msg;
    els.syncStatus.className = isSuccess ? 'sync synced' : 'sync error';
  }

  function renderList() {
    els.list.innerHTML = '';
    if (reminders.length === 0) {
      els.emptyMsg.textContent = "Belum ada data di Cloud.";
      els.emptyMsg.classList.remove('hidden');
      return;
    }
    els.emptyMsg.classList.add('hidden');

    const sorted = [...reminders].sort((a, b) => new Date(a.due) - new Date(b.due));

    sorted.forEach((r) => {
      if (!r || !r.nama) return;

      const originalIndex = reminders.indexOf(r);
      const badgeClass = getCategoryClass(r.kategori);
      
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <span class="badge ${badgeClass}">${r.kategori || 'Lainnya'}</span>
        <div style="margin-top:4px"><b>${r.nama}</b> ${r.pemilik ? `<small>(${r.pemilik})</small>` : ''}</div>
        <div style="margin: 8px 0; font-size: 14px;">
          📅 <strong>Jatuh Tempo:</strong> ${r.due || '-'}<br>
          ⏱️ Periode: ${r.periode?.value ? r.periode.value + ' ' + r.periode.unit : '-'}
        </div>
        <div class="actions">
          <button class="edit" onclick="editReminder(${originalIndex})">Edit</button>
          <button class="success" onclick="markDone(${originalIndex})">Selesai</button>
          <button class="danger" onclick="deleteReminder(${originalIndex})">Hapus</button>
        </div>
      `;
      els.list.appendChild(item);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // --- FITUR DOWNLOAD LOKAL ---
  function downloadJson() {
    if(reminders.length === 0) { showToast("⚠️ Tidak ada data"); return; }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reminders, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = "backup.json";
    a.click();
  }
  function triggerUpload() { document.getElementById('fileInput').click(); }
  
  function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data)) {
          reminders = data;
          saveData();
          renderList(); // PERBAIKAN: Refresh tampilan setelah upload
          showToast("✅ Data direstore ke Cloud");
        }
      } catch (err) { alert("File salah"); }
    };
    reader.readAsText(file);
    input.value = '';
  }

  // Jalankan pertama kali
  fetchData();

</script>

</body>
</html>

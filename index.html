<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Reminder Pribadi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<style>
/* ===== BASE ===== */
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:#f4f6f8;
  margin:0;
  padding:16px;
  color: #1e293b;
}
h2,h3{margin:8px 0; color: #0f172a;}
input,select,button{
  width:100%;
  padding:12px; /* Padding lebih besar untuk sentuhan jari */
  margin:8px 0 4px 0;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-size:16px; /* Mencegah zoom otomatis di iPhone */
  box-sizing: border-box;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:600;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:active{opacity: 0.8;}
button.success{background:#16a34a;color:white;}
button.secondary{background:#475569;}
button.danger{background:#dc2626;}
button.edit{background:#f59e0b; color: white; margin-top: 5px;}

.hidden{display:none !important;}

/* ===== CARD ===== */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 6px -1px rgba(0,0,0,.1);
}

/* ===== UTILS ===== */
/* Class .flex ini ditambahkan agar input periode berdampingan */
.flex{
  display:flex;
  gap:10px;
}
.flex input, .flex select{
  margin-top:0;
}

/* ===== STATUS SYNC ===== */
.sync{
  padding:10px;
  border-radius:8px;
  font-size:14px;
  margin-bottom:12px;
  text-align:center;
  font-weight:600;
}
.sync.synced{background:#dcfce7;color:#166534; border: 1px solid #86efac;}
.sync.local{background:#dbeafe;color:#1e40af; border: 1px solid #93c5fd;}

/* ===== LOADING ===== */
#loading{
  text-align:center;
  padding:20px;
}
.spinner{
  border:4px solid #e5e7eb;
  border-top:4px solid #2563eb;
  border-radius:50%;
  width:30px;
  height:30px;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#1f2937;
  color:#fff;
  padding:12px 24px;
  border-radius:50px;
  font-size:14px;
  z-index:1000;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  opacity:0;
  transition: opacity 0.3s;
  pointer-events: none;
  width: max-content;
  max-width: 90%;
}
#toast.show{opacity:1;}

/* ===== LIST ITEM ===== */
.list-item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  position:relative;
}
.list-item small{
  color:#64748b;
  display:block;
  margin-bottom:4px;
}

/* ===== BADGE ===== */
.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  color:#fff;
  background:#94a3b8; /* Default */
  margin-bottom:8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Kategori Mapping */
/* Kita gunakan substring atau logika di JS, tapi class siap sedia di sini */
.bg-sim{background:#16a34a}
.bg-stnk{background:#0284c7}
.bg-oli{background:#9333ea}
.bg-pajak{background:#dc2626}
.bg-asuransi{background:#0f766e}
.bg-service{background:#7c3aed}
.bg-lainnya{background:#64748b}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}
.actions button {
  flex: 1;
  padding: 8px;
  font-size: 13px;
}
</style>
</head>

<body>

<h2>🔔 Reminder Pribadi</h2>

<div id="syncStatus" class="sync local">🔵 Mode Lokal (Penyimpanan Browser)</div>

<div id="loading" class="hidden">
  <div class="spinner"></div>
  <small>Memproses...</small>
</div>

<!-- Form Input -->
<div class="card">
  <h3 id="formTitle">➕ Tambah Reminder</h3>

  <label>👤 Pemilik</label>
  <input id="pemilik" placeholder="Contoh: Saya / Istri">

  <label>🏷️ Kategori</label>
  <select id="kategori">
    <option value="SIM C">SIM C</option>
    <option value="SIM A">SIM A</option>
    <option value="SIM C Isteri">SIM C Isteri</option>
    <option value="Pajak Motor">Pajak Motor</option>
    <option value="Pajak Mobil">Pajak Mobil</option>
    <option value="Oli Motor">Oli Motor</option>
    <option value="Service Mobil">Service Mobil</option>
    <option value="Lainnya">Lainnya</option>
  </select>

  <label>📄 Nama / Keterangan</label>
  <input id="nama" placeholder="Contoh: Plat B 1234 XYZ">

  <label>📅 Tanggal Mulai</label>
  <input id="start_date" type="date">

  <label>⏱️ Periode Berulang</label>
  <div class="flex">
    <input id="periode_value" type="number" placeholder="Jumlah" min="1">
    <select id="periode_unit">
      <option value="bulan">Bulan</option>
      <option value="tahun">Tahun</option>
    </select>
  </div>

  <label>🔔 Pengingat (Hari sebelum)</label>
  <input id="custom_days" placeholder="Contoh: 30, 7, 1">

  <!-- Tombol ini ID-nya btnSave, nanti kita ubah teksnya via JS -->
  <button id="btnSave" onclick="processSave()">➕ Simpan Reminder</button>
  <button id="btnCancel" class="secondary hidden" onclick="resetForm()">Batal Edit</button>
</div>

<div class="card">
  <h3>📋 Daftar Aktif</h3>
  <div id="list"></div>
  <small id="emptyMsg" class="hidden" style="display:block; text-align:center; color:#94a3b8; margin:20px 0;">Belum ada reminder.</small>
</div>

<div class="card">
  <button class="secondary" onclick="downloadJson()">⬇️ Backup JSON</button>
</div>

<div id="toast">Notifikasi</div>
  
<script>
// === KONFIGURASI & REFERENSI ELEMENT ===
const elements = {
  nama: document.getElementById('nama'),
  pemilik: document.getElementById('pemilik'),
  kategori: document.getElementById('kategori'),
  start_date: document.getElementById('start_date'),
  periode_value: document.getElementById('periode_value'),
  periode_unit: document.getElementById('periode_unit'),
  custom_days: document.getElementById('custom_days'),
  list: document.getElementById('list'),
  btnSave: document.getElementById('btnSave'),
  btnCancel: document.getElementById('btnCancel'),
  formTitle: document.getElementById('formTitle'),
  emptyMsg: document.getElementById('emptyMsg')
};

// === STATE ===
let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
let editIndex = null;

// === FUNGSI UTAMA ===

function saveToLocal() {
  localStorage.setItem('reminders', JSON.stringify(reminders));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Fungsi Helper: Hitung Tanggal Jatuh Tempo (Due Date)
function calculateDueDate(startDate, periodVal, periodUnit) {
  if (!startDate) return '';
  const d = new Date(startDate);
  const val = Number(periodVal) || 0;
  
  if (periodUnit === 'bulan') {
    d.setMonth(d.getMonth() + val);
  } else if (periodUnit === 'tahun') {
    d.setFullYear(d.getFullYear() + val);
  }
  return d.toISOString().slice(0, 10);
}

// Fungsi Helper: Tentukan Class CSS warna badge berdasarkan kategori
function getCategoryClass(kat) {
  if (kat.includes('SIM')) return 'bg-sim';
  if (kat.includes('STNK')) return 'bg-stnk';
  if (kat.includes('Pajak')) return 'bg-pajak';
  if (kat.includes('Oli')) return 'bg-oli';
  if (kat.includes('Service')) return 'bg-service';
  if (kat.includes('Asuransi')) return 'bg-asuransi';
  return 'bg-lainnya';
}

// Tombol Simpan (Add / Update) dipanggil dari HTML
function processSave() {
  // Validasi sederhana
  if (!elements.nama.value || !elements.start_date.value) {
    showToast("⚠️ Nama dan Tanggal Mulai wajib diisi!");
    return;
  }

  // Hitung Due Date otomatis
  const calculatedDue = calculateDueDate(
    elements.start_date.value,
    elements.periode_value.value,
    elements.periode_unit.value
  );

  // Parsing reminder days (30,7,1)
  const remindersArr = elements.custom_days.value
    .split(',')
    .map(d => Number(d.trim()))
    .filter(n => !isNaN(n));

  const data = {
    pemilik: elements.pemilik.value,
    kategori: elements.kategori.value,
    nama: elements.nama.value,
    start_date: elements.start_date.value,
    // Jika user belum set periode, due = start_date
    due: calculatedDue || elements.start_date.value,
    periode: {
      value: Number(elements.periode_value.value) || 0,
      unit: elements.periode_unit.value
    },
    custom_reminder: remindersArr,
    status: 'pending',
    completed_at: null,
    created_at: new Date().toISOString()
  };

  if (editIndex !== null) {
    // Mode Update
    data.created_at = reminders[editIndex].created_at; // Keep original created date
    reminders[editIndex] = data;
    showToast("✅ Reminder diperbarui!");
  } else {
    // Mode Add
    reminders.push(data);
    showToast("✅ Reminder ditambahkan!");
  }

  saveToLocal();
  resetForm();
  renderList();
}

function editReminder(i) {
  const r = reminders[i];
  editIndex = i;

  elements.pemilik.value = r.pemilik || '';
  elements.kategori.value = r.kategori;
  elements.nama.value = r.nama;
  elements.start_date.value = r.start_date;
  elements.periode_value.value = r.periode?.value || '';
  elements.periode_unit.value = r.periode?.unit || 'bulan';
  elements.custom_days.value = (r.custom_reminder || []).join(',');

  // Ubah UI Form
  elements.formTitle.textContent = "✏️ Edit Reminder";
  elements.btnSave.textContent = "💾 Simpan Perubahan";
  elements.btnSave.classList.remove('success'); // Reset warna jika ada
  elements.btnCancel.classList.remove('hidden');
  
  // Scroll ke form
  document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
}

function deleteReminder(i) {
  if (confirm('Yakin hapus reminder ini?')) {
    reminders.splice(i, 1);
    saveToLocal();
    renderList();
    showToast("🗑️ Dihapus");
  }
}

function markDone(i) {
  // Logika selesai: generate tanggal berikutnya?
  // Untuk simplifikasi di file ini, kita hanya tandai status done atau update due date
  // Kita gunakan fungsi autoGenerateNext seperti request awal
  
  const r = reminders[i];
  
  // Jika ada periode, kita buat reminder baru atau update tanggal ini?
  // Kita update tanggal ini ke masa depan
  if (r.periode && r.periode.value > 0) {
    const nextDue = calculateDueDate(r.due, r.periode.value, r.periode.unit);
    reminders[i].due = nextDue;
    reminders[i].start_date = nextDue; // Reset start date juga biar logis
    showToast(`🔄 Diperbarui ke: ${nextDue}`);
  } else {
    // Jika one-time, bisa dihapus atau status jadi done
    reminders[i].status = 'done';
    showToast("✅ Selesai");
  }
  
  saveToLocal();
  renderList();
}

function resetForm() {
  elements.pemilik.value = '';
  elements.k.selectedIndex = 0;
  elements.nama.value = '';
  elements.start_date.value = '';
  elements.periode_value.value = '';
  elements.periode_unit.value = 'bulan';
  elements.custom_days.value = '';
  
  editIndex = null;
  elements.formTitle.textContent = "➕ Tambah Reminder";
  elements.btnSave.textContent = "➕ Simpan Reminder";
  elements.btnCancel.classList.add('hidden');
}

function renderList() {
  elements.list.innerHTML = '';
  
  if (reminders.length === 0) {
    elements.emptyMsg.classList.remove('hidden');
    return;
  } else {
    elements.emptyMsg.classList.add('hidden');
  }

  // Urutkan berdasarkan tanggal due terdekat
  const sortedReminders = [...reminders].sort((a, b) => new Date(a.due) - new Date(b.due));

  sortedReminders.forEach((r) => {
    // Cari index asli (karena kita sort untuk display)
    const originalIndex = reminders.indexOf(r);
    const badgeClass = getCategoryClass(r.kategori);
    
    const item = document.createElement('div');
    item.className = 'list-item';
    
    item.innerHTML = `
      <span class="badge ${badgeClass}">${r.kategori}</span>
      <div style="margin-top:4px">
        <b>${r.nama}</b> ${r.pemilik ? `<small>(${r.pemilik})</small>` : ''}
      </div>
      
      <div style="margin: 8px 0; font-size: 14px;">
        📅 <strong>Jatuh Tempo:</strong> ${r.due}<br>
        ⏱️ Periode: ${r.periode?.value ? r.periode.value + ' ' + r.periode.unit : '-'}
      </div>

      <div class="actions">
        <button class="edit" onclick="editReminder(${originalIndex})">Edit</button>
        <button class="success" onclick="markDone(${originalIndex})">Selesai/Reset</button>
        <button class="danger" onclick="deleteReminder(${originalIndex})">Hapus</button>
      </div>
    `;
    elements.list.appendChild(item);
  });
}

function downloadJson() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reminders, null, 2));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "reminders_backup.json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

// Render awal
renderList();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reminder Pribadi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<style>
/* ===== BASE ===== */
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:#f4f6f8;
  margin:0;
  padding:16px;
}
h2,h3{margin:8px 0}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #cbd5e1;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:600;
}
 button.success{
  background:#16a34a;
  color:white;
  margin-left:6px;
} 
button.secondary{background:#475569}
button.danger{background:#dc2626}
.hidden{display:none}

/* ===== CARD ===== */
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* ===== STATUS ===== */
.sync{
  padding:8px;
  border-radius:8px;
  font-size:14px;
  margin-bottom:12px;
}
.sync.synced{background:#dcfce7;color:#166534}
.sync.local{background:#dbeafe;color:#1e40af}
.sync.dirty{background:#fef9c3;color:#854d0e}

/* ===== LOADING ===== */
#loading{
  text-align:center;
  padding:12px;
}
.spinner{
  border:4px solid #e5e7eb;
  border-top:4px solid #2563eb;
  border-radius:50%;
  width:32px;
  height:32px;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-size:14px;
  z-index:99;
}

/* ===== LIST ===== */
.list-item{
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

/* ===== BADGE (INI YANG DIPERBAIKI) ===== */
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  color:#fff;
  background:#64748b; /* DEFAULT – kategori apa pun pasti muncul */
  margin-bottom:6px;
}

/* KATEGORI KHUSUS */
.SIM{background:#16a34a}
.STNK{background:#0284c7}
.Oli{background:#9333ea}

/* KATEGORI TAMBAHAN (AMAN JIKA DIPAKAI) */
.Pajak{background:#b91c1c}
.Asuransi{background:#0f766e}
.Service{background:#7c3aed}
.Lainnya{background:#475569}
</style>
</head>

<body>

<h2>🔔 Reminder Pribadi</h2>

<div id="syncStatus" class="sync local">🔵 Mode Lokal</div>

<div id="loading" class="hidden">
  <div class="spinner"></div>
  <small>Sinkronisasi...</small>
</div>

<div id="toast" class="hidden"></div>

<div class="card">
<h3>➕ Tambah Reminder</h3>

  <label>👤 Pemilik</label>
  <input id="pemilik" placeholder="Contoh: Saya / Istri">

  <label>🏷️ Kategori</label>
  <select id="kategori">
    <option>SIM C</option>
    <option>SIM C Isteri</option>
    <option>SIM A</option>
    <option>Pajak Motor</option>
    <option>Pajak Mobil</option>
    <option>Oli Motor</option>
    <option>Service Mobil</option>
    <option>Lainnya</option>
  </select>

  <label>📄 Nama / Keterangan</label>
  <input id="nama" placeholder="Contoh: SIM C / Ganti Oli Motor">

  <label>📅 Tanggal Terbit / Mulai</label>
  <input id="start_date" type="date">

  <label>⏱️ Periode</label>
  <div class="flex">
    <input id="periode_value" type="number" placeholder="Contoh: 5 / 3">
    <select id="periode_unit">
      <option value="bulan">Bulan</option>
      <option value="tahun">Tahun</option>
    </select>
  </div>

  <label>🔔 Reminder (hari sebelum jatuh tempo)</label>
  <input id="custom" placeholder="Contoh: 30,7,1">

  <button id="btnSave" onclick="saveReminder()">➕ Tambah</button>
</div>

<div class="card" id="list"></div>

<div class="card">
  <button onclick="download()">⬇️ Download JSON</button>
</div>

<div id="toast" class="hidden"></div>
  
<script>
// === ELEMENT REFERENCES (WAJIB UNTUK MOBILE/PWA) ===
const nama = document.getElementById('nama');
const kategori = document.getElementById('kategori');
const start_date = document.getElementById('start_date');
const due = document.getElementById('due');
const periode_value = document.getElementById('periode_value');
const periode_unit = document.getElementById('periode_unit');
const custom_days = document.getElementById('custom_days');

const btnAdd = document.getElementById('btnAdd');
const btnUpdate = document.getElementById('btnUpdate');  
let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
let editIndex = null;

function save(){
  localStorage.setItem('reminders', JSON.stringify(reminders));
}

function addReminder(){
  reminders.push({
    nama: nama.value,
    kategori: kategori.value,
    start_date: start_date.value,
    due: due.value,
    periode:{
      value:Number(periode_value.value),
      unit:periode_unit.value
    },
    custom_reminder: custom_days.value
      .split(',')
      .map(d=>Number(d.trim()))
      .filter(Boolean),
    status:'pending',
    completed_at:null,
    last_sent:null
  });
  save();
  clearForm();
  render();
}

function editReminder(i){
  const r = reminders[i];
  editIndex = i;

  nama.value = r.nama;
  kategori.value = r.kategori;
  start_date.value = r.start_date;
  due.value = r.due;
  periode_value.value = r.periode?.value || '';
  periode_unit.value = r.periode?.unit || 'bulan';
  custom_days.value = (r.custom_reminder || []).join(',');

  btnAdd.classList.add('hidden');
  btnUpdate.classList.remove('hidden');
  document.getElementById('formTitle').textContent='✏️ Edit Reminder';
}

function updateReminder(){
  if(editIndex === null) return;

  reminders[editIndex] = {
    ...reminders[editIndex],
    nama: nama.value,
    kategori: kategori.value,
    start_date: start_date.value,
    due: due.value,
    periode:{
      value:Number(periode_value.value),
      unit:periode_unit.value
    },
    custom_reminder: custom_days.value
      .split(',')
      .map(d=>Number(d.trim()))
      .filter(Boolean)
  };

  editIndex = null;
  save();
  clearForm();
  render();
}

function removeItem(i){
  if(confirm('Hapus reminder?')){
    reminders.splice(i,1);
    save();
    render();
  }
}

function markDone(i){
  const r = reminders[i];
  r.status='done';
  r.completed_at=new Date().toISOString().slice(0,10);
  autoGenerateNext(r);
  save();
  render();
}

function autoGenerateNext(r){
  if(!r.periode || !r.periode.value) return;

  const d = new Date(r.due);
  if(r.periode.unit==='bulan'){
    d.setMonth(d.getMonth()+r.periode.value);
  }
  if(r.periode.unit==='tahun'){
    d.setFullYear(d.getFullYear()+r.periode.value);
  }
  r.due=d.toISOString().slice(0,10);
  r.status='pending';
  r.last_sent=null;
}

function clearForm(){
  nama.value='';
  start_date.value='';
  due.value='';
  periode_value.value='';
  custom_days.value='';
  btnAdd.classList.remove('hidden');
  btnUpdate.classList.add('hidden');
  document.getElementById('formTitle').textContent='➕ Tambah Reminder';
}

function render(){
  const list=document.getElementById('list');
  list.innerHTML='<h3>📋 Daftar Reminder</h3>';
  reminders.forEach((r,i)=>{
    list.innerHTML+=`
      <div class="list-item">
        <span class="badge">${r.kategori}</span><br>
        <b>${r.nama}</b><br>
        📅 ${r.due}<br>
        ⏱️ ${r.periode?.value||'-'} ${r.periode?.unit||''}<br>

        <button class="edit" onclick="editReminder(${i})">✏️ Edit</button>
        <button class="success" onclick="markDone(${i})">✅ Selesai</button>
        <button class="danger" onclick="removeItem(${i})">🗑️ Hapus</button>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
